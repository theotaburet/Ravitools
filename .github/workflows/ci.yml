name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web/client, web/server]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        working-directory: ${{ matrix.package }}
      - name: Test
        run: bun run test
        working-directory: ${{ matrix.package }}
      # Blocking since the lint backlog was cleared (AUDIT R34).
      - name: Lint
        run: bun run lint
        working-directory: ${{ matrix.package }}
