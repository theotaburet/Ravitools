name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web/client, web/server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # npm install, not npm ci: vitest@4 pulls a nested vite needing esbuild@0.28,
      # and npm ci chokes (EBADPLATFORM) on esbuild's cross-platform optionalDeps.
      # npm install respects the lock but skips wrong-platform optionals correctly.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Blocking since the lint backlog was cleared (AUDIT R34).
      - name: Lint
        run: npm run lint
